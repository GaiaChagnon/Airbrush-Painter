name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpotrace-dev libagg-dev pkg-config

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/ robot_control/ scripts/ tests/

      - name: Run core tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run robot control tests
        run: python -m pytest robot_control/tests/ -v --tb=short
